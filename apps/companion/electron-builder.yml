appId: com.avenqio.presence
productName: AvenqioPresence
copyright: Copyright © 2026 Avenqio

directories:
  output: release
  buildResources: build

# esbuild produces a self-contained bundle, so no node_modules are shipped.
files:
  - dist/**
  - package.json
  - "!node_modules/**"

asar: true

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: AvenqioPresence
  deleteAppDataOnUninstall: false

portable:
  artifactName: ${productName}-${version}-portable.${ext}

artifactName: ${productName}-${version}-${arch}.${ext}

# Code signing and a release feed are required for silent self-updates. Without
# them the app checks a signed feed when COMPANION_UPDATE_FEED_URL is set and
# otherwise tells the user to download the new installer.
publish: null
